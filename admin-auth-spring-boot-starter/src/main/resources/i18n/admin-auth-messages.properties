# admin-auth 文案（基础文件 = 英文，作为兜底语言）
# 键稳定不变；页面与脚本只用 page.* / js.*，错误码只用 error.*
# 占位符为 {0} / {1}，由 BundleAdminAuthMessages 替换（不走 MessageFormat，避免单引号问题）

# ---------- 错误码（与 ApiErrorCode 一一对应） ----------
admin-auth.error.auth-failed=Incorrect account or password
admin-auth.error.ticket-expired=Your sign-in session has expired. Please sign in again.
admin-auth.error.mfa-required=Two-factor verification is required
admin-auth.error.mfa-locked=Too many attempts. Please try again later.
admin-auth.error.channel-forbidden=This verification channel is disabled because it matches your sign-in identifier
admin-auth.error.mfa-required-by-policy=Two-factor authentication is required for this account
admin-auth.error.step-up-required=Please complete two-factor verification again
admin-auth.error.forbidden=Access denied
admin-auth.error.not-implemented=This capability is not implemented yet
admin-auth.error.validation-failed=Request validation failed
admin-auth.error.password-mismatch=Current password is incorrect
admin-auth.error.internal-error=Internal server error

# ---------- 具体错误（code 不变，只有 message 更具体） ----------
admin-auth.error.not-logged-in=Not signed in or the session has expired
admin-auth.error.ticket-not-found=The sign-in ticket does not exist or has been used. Please sign in again.
admin-auth.error.ticket-invalid=The sign-in ticket has expired. Please sign in again.
admin-auth.error.ticket-step-mismatch=The sign-in step does not match. Please sign in again.
admin-auth.error.account-not-found=Account not found
admin-auth.error.cannot-disable-self=You cannot disable the account you are signed in with
admin-auth.error.last-super-admin=At least one active SUPER_ADMIN must remain
admin-auth.error.invalid-mfa-require-value=value must be -1, 0 or 1
admin-auth.error.super-admin-required=Super administrator privileges are required
admin-auth.error.operation-failed=The operation failed. Please try again later.
admin-auth.error.bad-request-body=Malformed request body
admin-auth.error.invalid-input=Invalid input
admin-auth.error.otp-not-implemented=EMAIL_OTP / SMS_OTP channels are not implemented yet (v1.1)
admin-auth.error.recovery-code-invalid=The recovery code is incorrect or has already been used
admin-auth.error.mfa-cannot-disable=Two-factor authentication is required by the current security policy and cannot be disabled
admin-auth.error.totp-bind-failed=TOTP binding failed

# ---------- core 密码策略（PasswordPolicyReason） ----------
admin-auth.password.user-not-found=Account not found
admin-auth.password.user-disabled=This account is disabled
admin-auth.password.old-mismatch=Current password is incorrect
admin-auth.password.too-short=Password must be at least {0} characters long
admin-auth.password.same-as-old=The new password must differ from the current password
admin-auth.password.blank=The password must not be blank

# ---------- core 第二因素（MfaFailureReason） ----------
admin-auth.mfa.setup-expired=The TOTP setup has expired. Please start again.
admin-auth.mfa.code-invalid=Incorrect verification code
admin-auth.mfa.not-bound=TOTP is not bound yet
admin-auth.mfa.too-many-attempts=Too many two-factor attempts. Please try again later.
admin-auth.mfa.already-bound=TOTP is already bound. Disable it before binding again.
admin-auth.mfa.account-not-found=Account not found

