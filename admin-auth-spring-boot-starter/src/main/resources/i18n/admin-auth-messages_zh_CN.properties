# admin-auth 文案（简体中文）
# 与基础文件 admin-auth-messages.properties 键集合必须完全一致（有单测校验）

# ---------- 错误码（与 ApiErrorCode 一一对应） ----------
admin-auth.error.auth-failed=账号或密码错误
admin-auth.error.ticket-expired=登录会话已过期，请重新登录
admin-auth.error.mfa-required=需要完成第二因素验证
admin-auth.error.mfa-locked=尝试次数过多，请稍后再试
admin-auth.error.channel-forbidden=该验证通道与登录标识同源，已禁用
admin-auth.error.mfa-required-by-policy=当前账号被要求启用 2FA
admin-auth.error.step-up-required=需要重新完成二次验证
admin-auth.error.forbidden=无权访问
admin-auth.error.not-implemented=该能力尚未实现
admin-auth.error.validation-failed=参数校验失败
admin-auth.error.password-mismatch=原密码不正确
admin-auth.error.internal-error=服务器内部错误

# ---------- 具体错误（code 不变，只有 message 更具体） ----------
admin-auth.error.not-logged-in=未登录或会话已过期
admin-auth.error.ticket-not-found=登录票据不存在或已使用，请重新登录
admin-auth.error.ticket-invalid=登录票据已过期，请重新登录
admin-auth.error.ticket-step-mismatch=登录步骤不匹配，请重新登录
admin-auth.error.account-not-found=账号不存在
admin-auth.error.cannot-disable-self=不能停用当前登录账号
admin-auth.error.last-super-admin=至少保留一个可用的 SUPER_ADMIN
admin-auth.error.invalid-mfa-require-value=value 只能是 -1 / 0 / 1
admin-auth.error.super-admin-required=需要超级管理员权限
admin-auth.error.operation-failed=操作失败，请稍后重试
admin-auth.error.bad-request-body=请求体格式不正确
admin-auth.error.invalid-input=输入格式不正确
admin-auth.error.otp-not-implemented=EMAIL_OTP / SMS_OTP 通道尚未实现（v1.1）
admin-auth.error.recovery-code-invalid=恢复码不正确或已使用
admin-auth.error.mfa-cannot-disable=当前安全策略要求启用 2FA，无法关闭
admin-auth.error.totp-bind-failed=TOTP 绑定失败

