<!DOCTYPE html>
<html lang="zh-CN" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${i18n['page.login.title']}">内部管理端 · 登录</title>
    <link rel="stylesheet" th:href="@{/admin-auth/app.css}"/>
</head>
<body class="aa-body">
<main class="aa-card">
    <div class="aa-brand" th:text="${i18n['page.login.brand']}">内部管理端</div>
    <p class="aa-sub" th:text="${i18n['page.login.subtitle']}">账号密码 + 动态口令（TOTP）双重验证</p>

    <form id="aa-login-form" class="aa-form">
        <label class="aa-field"><span th:text="${i18n['page.login.method']}">登录方式</span>
            <select id="aa-identity-type">
                <option value="EMAIL" th:text="${i18n['page.login.type.email']}">邮箱</option>
                <option value="PHONE" th:text="${i18n['page.login.type.phone']}">手机号</option>
                <option value="STAFF_CODE" th:text="${i18n['page.login.type.staffCode']}">员工码</option>
            </select>
        </label>
        <label class="aa-field"><span th:text="${i18n['page.login.identifier']}">账号</span>
            <input id="aa-identifier" name="username" autocomplete="username" required/>
        </label>
        <label class="aa-field"><span th:text="${i18n['page.login.password']}">密码</span>
            <input id="aa-password" name="password" type="password" autocomplete="current-password" required/>
        </label>
        <button class="aa-btn" type="submit" th:text="${i18n['page.login.submit']}">登 录</button>
        <p id="aa-message" class="aa-message" role="alert"></p>
    </form>

    <p class="aa-foot" th:text="${i18n['page.login.foot']}">如需帮助请联系信息安全团队</p>
</main>

<script th:inline="javascript">
    window.AA_PREFIX = /*[[@{/admin-auth}]]*/ '/admin-auth';
    window.AA_I18N = /*[[${i18n}]]*/ {};
</script>
<script th:src="@{/admin-auth/app.js}"></script>
<script>AA.loginPage();</script>
</body>
</html>
