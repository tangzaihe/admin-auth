<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>内部管理端 · 修改密码</title>
    <link rel="stylesheet" th:href="@{/admin-auth/app.css}"/>
</head>
<body class="aa-body">
<main class="aa-card">
    <div class="aa-brand">修改密码</div>
    <p class="aa-sub" id="aa-hint">密码至少 12 位，建议使用大小写字母、数字与符号的组合。</p>

    <form id="aa-password-form" class="aa-form">
        <label class="aa-field">当前密码
            <input id="aa-old-password" type="password" autocomplete="current-password" required/>
        </label>
        <label class="aa-field">新密码
            <input id="aa-new-password" type="password" autocomplete="new-password" minlength="12" required/>
        </label>
        <label class="aa-field">确认新密码
            <input id="aa-confirm-password" type="password" autocomplete="new-password" minlength="12" required/>
        </label>
        <button class="aa-btn" type="submit">提交</button>
        <p id="aa-message" class="aa-message" role="alert"></p>
    </form>

    <p class="aa-foot"><a id="aa-back-login" href="#">返回登录</a></p>
</main>

<script th:inline="javascript">
    window.AA_PREFIX = /*[[@{/admin-auth}]]*/ '/admin-auth';
</script>
<script th:src="@{/admin-auth/app.js}"></script>
<script>AA.passwordChangePage();</script>
</body>
</html>
