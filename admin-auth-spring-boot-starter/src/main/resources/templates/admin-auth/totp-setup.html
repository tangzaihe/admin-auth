<!DOCTYPE html>
<html lang="zh-CN" th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${i18n['page.totp.title']}">内部管理端 · 绑定 TOTP</title>
    <link rel="stylesheet" th:href="@{/admin-auth/app.css}"/>
</head>
<body class="aa-body">
<main class="aa-card aa-wide">
    <div class="aa-brand" th:text="${i18n['page.totp.brand']}">绑定认证器</div>
    <p class="aa-sub" th:text="${i18n['page.totp.subtitle']}">用 Google Authenticator / Microsoft Authenticator / 1Password 扫描二维码，或手动输入密钥。</p>

    <div class="aa-qr" id="aa-qr" th:aria-label="${i18n['page.totp.qrAria']}" aria-label="TOTP 二维码"></div>

    <div class="aa-secret-row">
        <span class="aa-label" th:text="${i18n['page.totp.manualSecret']}">手动密钥</span>
        <code id="aa-secret">—</code>
        <button class="aa-mini" type="button" id="aa-copy-secret"
                th:text="${i18n['page.totp.copy']}">复制</button>
    </div>

    <form id="aa-confirm-form" class="aa-form">
        <label class="aa-field"><span th:text="${i18n['page.totp.codeLabel']}">输入认证器上的 6 位动态码</span>
            <input id="aa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"
                   pattern="[0-9 ]*" th:placeholder="${i18n['page.totp.codePlaceholder']}"
                   placeholder="123456" required/>
        </label>
        <button class="aa-btn" type="submit" th:text="${i18n['page.totp.submit']}">确认绑定</button>
        <p id="aa-message" class="aa-message" role="alert"></p>
    </form>

    <p class="aa-foot" th:text="${i18n['page.totp.foot']}">绑定成功后会一次性展示 10 个恢复码，请离线保存。</p>
</main>

<script th:inline="javascript">
    window.AA_PREFIX = /*[[@{/admin-auth}]]*/ '/admin-auth';
    window.AA_I18N = /*[[${i18n}]]*/ {};
</script>
<script th:src="@{/admin-auth/app.js}"></script>
<script>AA.totpSetupPage();</script>
</body>
</html>
